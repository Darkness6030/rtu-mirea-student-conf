{% load static %}
<!doctype html>
<html lang="ru">
<head>

    <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">

    <script src="{% static 'homepage/js/main.js' %}" defer></script>
</head>
<body>
